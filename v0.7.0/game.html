		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"game","experimentalVK":false,"fileSizes":{"game.pck":4217848,"game.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>

  document.head.append(style);
  const registered = new WeakSet();
  let dialog, trigger;
  async function copy(button, status, number) {
    let copied = false;
    try { await navigator.clipboard.writeText(account); copied = true; } catch {
      const field = document.createElement('textarea'); field.value = account; field.readOnly = true;
      field.style.cssText='position:fixed;left:-9999px;top:0;font-size:16px'; dialog.append(field); field.select();
      try { copied = document.execCommand('copy'); } catch {}
      field.remove(); button.focus({preventScroll:true});
    }
    status.textContent = words()[copied ? 4 : 5];
    number.hidden = copied;
    if(!copied){number.focus();number.select();}
  }
  function open(anchor) {
    if(dialog?.open) return;
    trigger = anchor;
    if(!dialog){
      dialog=document.createElement('dialog');dialog.className='roky-support-dialog';dialog.setAttribute('aria-labelledby','roky-support-title');
      dialog.addEventListener('close',()=>{window.dispatchEvent(new CustomEvent('roky:support',{detail:false}));if(trigger?.isConnected)trigger.focus({preventScroll:true});});
      dialog.addEventListener('keydown',e=>e.stopPropagation());document.body.append(dialog);

    const w=words(),head=document.createElement('div');head.className='roky-support-head';
    const title=document.createElement('h2');title.id='roky-support-title';title.textContent=w[0];
    const close=document.createElement('button');close.type='button';close.className='roky-support-close';close.textContent='×';close.setAttribute('aria-label',w[6]);close.onclick=()=>dialog.close();

  function install() {
    for(const anchor of document.querySelectorAll('a[href="'+url+'"]')){

        const old=document.querySelector(selector);if(old){old.hidden=true;old.style.setProperty('display','none','important');}

      anchor.addEventListener('keydown',event=>{if(event.key===' '){event.preventDefault();event.stopPropagation();open(anchor);}});
    }
  }
  function start(){install();new MutationObserver(install).observe(document.body,{childList:true,subtree:true});new MutationObserver(install).observe(document.documentElement,{attributes:true,attributeFilter:['lang']});window.addEventListener('roky:language',install);}

})();
