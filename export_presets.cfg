[preset.0]
name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter="assets/data/wardrobe.json"
exclude_filter="build/*,artifacts/*,tests/*,site/*,tools/*,docs/*,screenshots/*,supabase/*,release/*,public/*,server/*"
export_path="build/web/game.html"
script_export_mode=2

[preset.0.options]
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
progressive_web_app/enabled=false

[preset.1]
name="Linux Server"
platform="Linux"
runnable=false
export_filter="all_resources"
include_filter="assets/data/wardrobe.json"
exclude_filter="build/*,artifacts/*,tests/*,site/*,tools/*,docs/*,screenshots/*,supabase/*,release/*,server/gateway/*,server/tests/*,server/node_modules/*,server/.env*,server/*.json,server/*.yaml,server/Dockerfile"
export_path="build/server/server.pck"
script_export_mode=2

[preset.1.options]
binary_format/architecture="x86_64"
dedicated_server/strip_visuals=false
